services:
  - type: web
    name: sweetpotato-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && node ../scripts/generate-app-config.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_APP_URL
        value: https://sweetpotato-api.onrender.com
      - key: PUBLIC_API_BASE_URL
        value: https://sweetpotato-api.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SHOP_NOTIFY_EMAIL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_SHOP_USER_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_STOREFRONT_URL
        value: https://davidping-happy.github.io/sweetpotato/docs/index.html
      - key: LINE_LOGIN_CALLBACK_URL
        value: https://sweetpotato-api.onrender.com/api/line/login/callback
      - key: LINE_NOTIFY_WEBHOOK_URL
        sync: false
      # 允許跨來源的前端網域（逗號分隔）。GitHub Pages 前台需要它才能呼叫此 API。
      - key: ALLOWED_ORIGINS
        value: https://davidping-happy.github.io
      # ⚠️ 重要：Render 檔案系統為 ephemeral（重啟/重新部署會清空 data/）。
      # 必須設定 MongoDB Atlas 連線字串，訂單 / 管理員密碼 / 商品 / 店家設定才會永久保存。
      # 於 Render Dashboard → Environment 填入實際連線字串（不要提交到 git）。
      - key: MONGODB_URI
        sync: false
