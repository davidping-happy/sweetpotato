services:
  - type: web
    name: sweetpotato-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_SHOP_USER_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_STOREFRONT_URL
        sync: false
      - key: LINE_LIFF_ID
        sync: false
      - key: LINE_NOTIFY_WEBHOOK_URL
        sync: false
      # Optional: set this in Render dashboard if using MongoDB Atlas
      # - key: MONGODB_URI
      #   value: mongodb+srv://<username>:<password>@<cluster>/<db>
