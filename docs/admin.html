<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>磐石烤地瓜 - 訂單後台</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff9e6; color: #3a2e2a; }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; color: #f28c28; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); margin-bottom: 16px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, button, select { padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
    button { background: #f28c28; color: #fff; border: none; cursor: pointer; }
    button.secondary { background: #5d4037; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
    th { color: #5d4037; background: #fff5df; }
    .muted { color: #777; font-size: 13px; }
    .ok { color: #0f8a43; }
    .err { color: #c62828; }
    .detail-box { background: #f7f7f7; padding: 12px; border-radius: 8px; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .items-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; }
    .items-table th, .items-table td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
    .items-table th { background: #fff5df; color: #5d4037; }
    .items-table tr:last-child td { border-bottom: none; }
    .items-total { margin-top: 8px; font-weight: bold; color: #5d4037; }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline-item { position: relative; padding-left: 18px; margin-bottom: 12px; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-item::before { content: ''; position: absolute; left: 0; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: #f28c28; }
    .timeline-item::after { content: ''; position: absolute; left: 3px; top: 16px; width: 2px; height: calc(100% + 4px); background: #e5d7c0; }
    .timeline-item:last-child::after { display: none; }
    .timeline-title { font-weight: bold; color: #5d4037; }
    .timeline-meta { color: #777; font-size: 12px; margin-top: 2px; }
    .order-link { color: #5d4037; text-decoration: underline; cursor: pointer; font-weight: 600; }
    .detail-row td { background: #fffdf7; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>訂單後台</h1>
    <p class="muted" style="margin:-8px 0 16px;font-size:13px;">
      訂單永久保存：建議
      <a href="./DEPLOY_VPS.md">VPS 部署（orders.json）</a>
      或
      <a href="./setup-mongodb-atlas.html">MongoDB Atlas</a>
    </p>

    <div class="card">
      <div class="row">
        <button id="reloadBtn">重新載入訂單</button>
        <button id="logoutBtn" class="secondary">登出</button>
        <input id="operatorInput" value="admin" placeholder="操作人（例如店長）" />
        <button id="testApiBtn" class="secondary">測試連線</button>
        <span id="status" class="muted">尚未載入</span>
      </div>
      <div class="row" style="margin-top: 10px;">
        <button id="downloadJsonBtn" class="secondary">下載訂單備份（JSON）</button>
        <button id="downloadCsvBtn" class="secondary">下載訂單（Excel/CSV）</button>
        <button id="importBtn" class="secondary">還原訂單（匯入備份）</button>
        <input id="importFile" type="file" accept=".json,application/json" style="display:none;" />
        <span id="backupHint" class="muted">每次系統更新前，建議先「下載備份」；更新後若紀錄消失，用「還原訂單」匯回。</span>
      </div>
      <div class="row" style="margin-top: 10px;">
        <select id="statusFilter">
          <option value="">全部狀態</option>
          <option value="pending">待處理</option>
          <option value="shipped">已出貨</option>
          <option value="completed">已完成</option>
        </select>
        <select id="timeSort">
          <option value="created_desc">時間排序：新到舊</option>
          <option value="created_asc">時間排序：舊到新</option>
          <option value="updated_desc">最近更新：新到舊</option>
          <option value="updated_asc">最近更新：舊到新</option>
        </select>
        <input id="keywordSearch" placeholder="關鍵字搜尋（訂單編號/姓名/電話/地址/品名）" style="min-width: 300px;" />
      </div>
      <table>
        <thead>
          <tr>
            <th>訂單編號</th>
            <th>建立時間</th>
            <th>產品明細</th>
            <th>姓名</th>
            <th>住址</th>
            <th>電話</th>
            <th>總金額</th>
            <th>狀態</th>
            <th>最近更新</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="11" class="muted">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="./app-runtime.js"></script>
  <script src="./admin-auth.js"></script>
  <script>
    const ordersBody = document.getElementById('ordersBody');
    const statusEl = document.getElementById('status');
    const logoutBtn = document.getElementById('logoutBtn');
    const operatorInput = document.getElementById('operatorInput');
    const statusFilter = document.getElementById('statusFilter');
    const timeSort = document.getElementById('timeSort');
    const keywordSearch = document.getElementById('keywordSearch');
    let allOrders = [];
    let expandedOrderNumber = null;
    const statusTransitions = {
      pending: ['pending', 'confirmed', 'cancelled'],
      confirmed: ['confirmed', 'shipped', 'cancelled'],
      shipped: ['shipped', 'completed'],
      completed: ['completed'],
      cancelled: ['cancelled'],
    };
    const statusLabelMap = {
      pending: '待處理',
      confirmed: '處理中',
      shipped: '已出貨',
      completed: '已完成',
      cancelled: '已取消',
    };

    function fmtDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString('zh-TW');
    }

    function apiUrl(path) {
      return window.AppRuntime.apiUrl(path);
    }

    async function getAuthHeaders() {
      const authHeaders = await window.AdminAuth.getAuthHeaders();
      if (!authHeaders?.Authorization) {
        window.location.replace('./admin-login.html?reason=unauthorized');
        throw new Error('未登入或登入已過期');
      }
      return authHeaders;
    }

    async function testApiConnection() {
      const base = window.AppRuntime.getApiBase();
      if (!base) {
        statusEl.className = 'err';
        statusEl.textContent = 'API 設定尚未載入';
        return;
      }
      statusEl.className = 'muted';
      statusEl.textContent = `測試連線中：${base}/api/health`;
      try {
        const res = await fetch(apiUrl('/api/health'));
        const json = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(json.message || `HTTP ${res.status}`);
        }
        statusEl.className = 'ok';
        statusEl.textContent = `連線成功：${base}/api/health（${json.status || 'ok'}）`;
      } catch (err) {
        statusEl.className = 'err';
        statusEl.textContent = `連線失敗：${err.message}`;
      }
    }

    function statusOptions(current) {
      const allowed = statusTransitions[current] || [current];
      return allowed.map((s) => {
        const label = statusLabelMap[s] || s;
        return `<option value="${s}" ${s === current ? 'selected' : ''}>${label}</option>`;
      }).join('');
    }

    function isTerminalStatus(status) {
      return status === 'completed' || status === 'cancelled';
    }

    function toMillis(value) {
      const ts = new Date(value || '').getTime();
      return Number.isNaN(ts) ? 0 : ts;
    }

    function normalizeText(value) {
      return String(value || '').trim().toLowerCase();
    }

    function orderSearchText(order) {
      const details = Array.isArray(order.itemDetails) ? order.itemDetails : [];
      const itemNames = details.map((it) => it?.name || '').join(' ');
      return normalizeText([
        order.orderNumber,
        order.status,
        order.customer?.name,
        order.customer?.phone,
        order.customer?.address,
        itemNames,
      ].join(' '));
    }

    function renderOrderDetailRow(order) {
      const items = Array.isArray(order.items)
        ? order.items
        : (Array.isArray(order.itemDetails) ? order.itemDetails : []);
      const itemsRows = items.map((it) => {
        const price = Number(it.price || 0);
        const qty = Number(it.quantity || 0);
        const lineTotal = price * qty;
        return `
          <tr>
            <td>${it.name || '-'}</td>
            <td>NT$${price}</td>
            <td>${qty}</td>
            <td>NT$${lineTotal}</td>
          </tr>
        `;
      }).join('');

      const history = Array.isArray(order.statusHistory) ? order.statusHistory : [];
      const timelineHtml = history.length
        ? history
          .slice()
          .sort((a, b) => new Date(a.changedAt) - new Date(b.changedAt))
          .map(h => `
            <li class="timeline-item">
              <div class="timeline-title">${h.from} → ${h.to}</div>
              <div class="timeline-meta">操作人：${h.changedBy || '-'} ｜ 時間：${fmtDate(h.changedAt)}</div>
            </li>
          `)
          .join('')
        : '<li class="muted">尚無狀態變更紀錄</li>';

      return `
        <tr class="detail-row">
          <td colspan="10">
            <div class="detail-box">
              <div class="detail-grid">
                <div><strong>訂單編號：</strong>${order.orderNumber || '-'}</div>
                <div><strong>目前狀態：</strong>${order.status || '-'}</div>
                <div><strong>建立時間：</strong>${fmtDate(order.createdAt)}</div>
                <div><strong>總金額：</strong>NT$${order.total ?? 0}</div>
                <div><strong>顧客：</strong>${order.customer?.name || '-'}</div>
                <div><strong>電話：</strong>${order.customer?.phone || '-'}</div>
                <div><strong>Email：</strong>${order.customer?.email || '-'}</div>
                <div><strong>地址：</strong>${order.customer?.address || '-'}</div>
                <div><strong>小計：</strong>NT$${order.subtotal ?? 0}</div>
                <div><strong>運費：</strong>NT$${order.shipping ?? 0}</div>
              </div>
              <div><strong>商品明細</strong></div>
              <table class="items-table">
                <thead>
                  <tr>
                    <th>品名</th>
                    <th>單價</th>
                    <th>數量</th>
                    <th>小計</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsRows || '<tr><td colspan="4" class="muted">無商品資料</td></tr>'}
                </tbody>
              </table>
              <div class="items-total">件數：${items.reduce((sum, it) => sum + Number(it.quantity || 0), 0)} 件</div>
              <h4 style="margin: 12px 0 8px;">狀態變更時間軸</h4>
              <ul class="timeline">
                ${timelineHtml}
              </ul>
            </div>
          </td>
        </tr>
      `;
    }

    function renderOrders(orders) {
      const rows = orders.map(o => {
        const details = Array.isArray(o.itemDetails) ? o.itemDetails : [];
        const detailsHtml = details.length
          ? details.map((it) => `${it.name || '-'} x${Number(it.quantity || 0)} @ NT$${Number(it.price || 0)}`).join('<br>')
          : '-';
        const isExpanded = expandedOrderNumber && expandedOrderNumber === o.orderNumber;
        return `
          <tr>
            <td>
              <span class="order-link" onclick="toggleOrderDetail('${o.orderNumber}')">
                ${o.orderNumber || '-'}
              </span>
            </td>
            <td>${fmtDate(o.createdAt)}</td>
            <td>${detailsHtml}</td>
            <td>${o.customer?.name || '-'}</td>
            <td>${o.customer?.address || '-'}</td>
            <td>${o.customer?.phone || '-'}</td>
            <td>NT$${o.total ?? 0}</td>
            <td>${o.status || '-'}</td>
            <td>${o.lastStatusBy || '-'}<br><span class="muted">${fmtDate(o.lastStatusAt)}</span></td>
            <td>
              <div class="row">
                <select id="status-${o.orderNumber}">
                  ${statusOptions(o.status)}
                </select>
                <button class="secondary" onclick="updateStatus('${o.orderNumber}')" ${isTerminalStatus(o.status) ? 'disabled title="此狀態不可再變更"' : ''}>更新</button>
              </div>
            </td>
          </tr>
          ${isExpanded ? renderOrderDetailRow(o) : ''}
        `;
      }).join('');
      ordersBody.innerHTML = rows || '<tr><td colspan="11" class="muted">目前沒有符合條件的訂單</td></tr>';
    }

    function applyOrderFilters() {
      const statusValue = normalizeText(statusFilter.value);
      const keyword = normalizeText(keywordSearch.value);
      const sortValue = timeSort.value || 'created_desc';
      let filtered = allOrders.filter((o) => {
        if (statusValue && normalizeText(o.status) !== statusValue) return false;
        if (keyword && !orderSearchText(o).includes(keyword)) return false;
        return true;
      });

      const sorters = {
        created_desc: (a, b) => toMillis(b.createdAt) - toMillis(a.createdAt),
        created_asc: (a, b) => toMillis(a.createdAt) - toMillis(b.createdAt),
        updated_desc: (a, b) => toMillis(b.lastStatusAt || b.createdAt) - toMillis(a.lastStatusAt || a.createdAt),
        updated_asc: (a, b) => toMillis(a.lastStatusAt || a.createdAt) - toMillis(b.lastStatusAt || b.createdAt),
      };
      filtered = filtered.slice().sort(sorters[sortValue] || sorters.created_desc);
      renderOrders(filtered);
      const keywordHint = keyword ? `，關鍵字「${keyword}」` : '';
      const statusHint = statusValue ? `，狀態：${statusValue}` : '';
      statusEl.className = 'ok';
      statusEl.textContent = `已顯示 ${filtered.length} / ${allOrders.length} 筆${statusHint}${keywordHint}`;
    }

    async function updateStatus(orderNumber) {
      const order = allOrders.find((o) => o.orderNumber === orderNumber);
      if (order && isTerminalStatus(order.status)) {
        statusEl.className = 'err';
        statusEl.textContent = `訂單 ${orderNumber} 目前為「${statusLabelMap[order.status] || order.status}」，不可再變更`;
        return;
      }
      const select = document.getElementById(`status-${orderNumber}`);
      const nextStatus = select ? select.value : '';
      if (!nextStatus) return;
      const changedBy = (operatorInput.value || '').trim() || 'admin';
      statusEl.className = 'muted';
      statusEl.textContent = `更新中：${orderNumber} -> ${nextStatus}（${changedBy}）`;

      try {
        const res = await fetch(apiUrl(`/api/orders/${encodeURIComponent(orderNumber)}/status`), {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            ...(await getAuthHeaders()),
          },
          body: JSON.stringify({ status: nextStatus, changedBy }),
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || '更新失敗');

        statusEl.className = 'ok';
        statusEl.textContent = `更新成功：${orderNumber} -> ${nextStatus}（${changedBy}）`;
        await loadOrders();
      } catch (err) {
        statusEl.className = 'err';
        statusEl.textContent = `更新失敗：${err.message}`;
      }
    }

    async function loadOrders() {
      statusEl.className = 'muted';
      statusEl.textContent = '載入中...';
      try {
        const authHeaders = await getAuthHeaders();
        const res = await fetch(apiUrl('/api/orders?limit=100'), {
          headers: authHeaders,
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || '載入失敗');
        allOrders = Array.isArray(json.data) ? json.data : [];
        applyOrderFilters();
      } catch (err) {
        ordersBody.innerHTML = '<tr><td colspan="11" class="err">載入失敗，請確認後端已啟動</td></tr>';
        statusEl.className = 'err';
        statusEl.textContent = `載入失敗：${err.message}`;
      }
    }

    function toggleOrderDetail(orderNumber) {
      expandedOrderNumber = expandedOrderNumber === orderNumber ? null : orderNumber;
      applyOrderFilters();
    }

    async function logout() {
      try {
        await window.AdminAuth.signOut();
      } catch (_) {
        // ignore
      }
      window.location.replace('./admin-login.html');
    }

    async function downloadOrders(format) {
      statusEl.className = 'muted';
      statusEl.textContent = `準備下載訂單備份（${format.toUpperCase()}）...`;
      try {
        const headers = await getAuthHeaders();
        const res = await fetch(apiUrl(`/api/orders/export?format=${format}`), { headers });
        if (!res.ok) throw new Error(`下載失敗（HTTP ${res.status}）`);
        const blob = await res.blob();
        const stamp = new Date().toISOString().slice(0, 10);
        const ext = format === 'csv' ? 'csv' : 'json';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `orders-${stamp}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.className = 'ok';
        statusEl.textContent = `✅ 已下載訂單備份（${ext.toUpperCase()}）`;
      } catch (err) {
        statusEl.className = 'err';
        statusEl.textContent = `下載失敗：${err.message}`;
      }
    }

    async function importOrdersFromFile(file) {
      if (!file) return;
      statusEl.className = 'muted';
      statusEl.textContent = '讀取備份檔...';
      try {
        const text = await file.text();
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (_) {
          throw new Error('檔案不是有效的 JSON 備份');
        }
        const headers = await getAuthHeaders();
        statusEl.textContent = '匯入中...';
        const res = await fetch(apiUrl('/api/orders/import'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify(Array.isArray(parsed) ? parsed : (parsed.data || parsed)),
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || '匯入失敗');
        statusEl.className = 'ok';
        statusEl.textContent = `✅ ${json.message}`;
        await loadOrders();
      } catch (err) {
        statusEl.className = 'err';
        statusEl.textContent = `匯入失敗：${err.message}`;
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', loadOrders);
    logoutBtn.addEventListener('click', logout);
    document.getElementById('testApiBtn').addEventListener('click', testApiConnection);
    document.getElementById('downloadJsonBtn').addEventListener('click', () => downloadOrders('json'));
    document.getElementById('downloadCsvBtn').addEventListener('click', () => downloadOrders('csv'));
    document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      importOrdersFromFile(file);
      e.target.value = '';
    });
    statusFilter.addEventListener('change', applyOrderFilters);
    timeSort.addEventListener('change', applyOrderFilters);
    keywordSearch.addEventListener('input', applyOrderFilters);
    window.updateStatus = updateStatus;
    window.toggleOrderDetail = toggleOrderDetail;
    (async () => {
      try {
        await window.AppRuntime.init();
      } catch (err) {
        statusEl.className = 'err';
        statusEl.textContent = `API 設定載入失敗：${err.message}`;
        return;
      }
      const auth = await window.AdminAuth.requireAdminSession({ loginPath: './admin-login.html' });
      if (!auth?.token) return;
      loadOrders();
    })();
  </script>
</body>
</html>
