<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>磐石烤地瓜 - 後台登入</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #fff9e6; color: #3a2e2a; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { width: 100%; max-width: 460px; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; color: #f28c28; }
    p { margin: 0 0 14px; color: #6b5a55; font-size: 14px; }
    label { display: block; margin: 10px 0 4px; font-size: 13px; color: #5d4037; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    button { width: 100%; margin-top: 14px; border: none; border-radius: 8px; padding: 11px 12px; background: #f28c28; color: #fff; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .7; cursor: wait; }
    button.secondary { background: #5d4037; }
    .inline-link { margin-top: 10px; font-size: 13px; color: #5d4037; text-decoration: underline; cursor: pointer; border: none; background: transparent; padding: 0; width: auto; }
    .hidden { display: none; }
    .msg { margin-top: 12px; font-size: 13px; }
    .ok { color: #0f8a43; }
    .err { color: #c62828; }
    .muted { color: #777; }
    .section-title { margin-top: 14px; margin-bottom: 8px; font-size: 14px; color: #5d4037; font-weight: 700; }
    .divider { border: 0; border-top: 1px solid #eee; margin: 14px 0; }
  </style>
  <script src="./admin-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin-auth.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>後台登入</h1>
      <p>請使用 Supabase Email/Password 帳號登入，未登入將無法進入後台。</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@example.com" required />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="輸入密碼" required />

        <button id="loginBtn" type="submit">登入後台</button>
      </form>
      <button id="forgotBtn" type="button" class="inline-link">忘記密碼？寄送重設連結</button>

      <div id="resetSection" class="hidden">
        <hr class="divider" />
        <div class="section-title">重設密碼</div>
        <label for="newPassword">新密碼</label>
        <input id="newPassword" type="password" placeholder="請輸入新密碼（至少 6 碼）" />
        <button id="resetPasswordBtn" type="button" class="secondary">更新為新密碼</button>
      </div>

      <div id="message" class="msg muted">請輸入管理員 Email / Password。</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    const forgotBtn = document.getElementById('forgotBtn');
    const resetSection = document.getElementById('resetSection');
    const resetPasswordBtn = document.getElementById('resetPasswordBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const newPasswordInput = document.getElementById('newPassword');
    const redirectTarget = './admin.html';

    function setMessage(text, cls) {
      msg.className = `msg ${cls || 'muted'}`;
      msg.textContent = text;
    }

    function applyReasonMessage() {
      const reason = new URLSearchParams(window.location.search).get('reason');
      if (reason === 'unauthorized') {
        setMessage('請先登入才能查看後台資料。', 'err');
      } else if (reason === 'config') {
        setMessage('請先設定 docs/admin-config.js 的 Supabase URL 與 Anon Key。', 'err');
      }
    }

    async function checkExistingSession() {
      try {
        const auth = await window.AdminAuth.requireAdminSession({
          loginPath: './admin-login.html',
          redirectOnFail: false,
        });
        if (auth?.session) {
          window.location.replace(redirectTarget);
        }
      } catch (_) {
        // ignore
      }
    }

    function ensureConfigReady() {
      const cfg = window.AdminAuth.getConfigFromWindow();
      if (!cfg.url || !cfg.anonKey) {
        setMessage('系統尚未設定登入服務，請先填寫 docs/admin-config.js。', 'err');
        loginBtn.disabled = true;
        return false;
      }
      loginBtn.disabled = false;
      return true;
    }

    function isRecoveryMode() {
      const hash = window.location.hash || '';
      const params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
      return params.get('type') === 'recovery' && Boolean(params.get('access_token'));
    }

    function initRecoveryMode() {
      if (!isRecoveryMode()) return;
      resetSection.classList.remove('hidden');
      setMessage('已進入密碼重設模式，請輸入新密碼。', 'ok');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!ensureConfigReady()) return;
      loginBtn.disabled = true;
      setMessage('登入中...', 'muted');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        const { error } = await window.AdminAuth.signInWithPassword(email, password);
        if (error) throw error;
        setMessage('登入成功，跳轉中...', 'ok');
        window.location.replace(redirectTarget);
      } catch (err) {
        setMessage(`登入失敗：${err.message || '未知錯誤'}`, 'err');
      } finally {
        loginBtn.disabled = false;
      }
    });

    forgotBtn.addEventListener('click', async () => {
      if (!ensureConfigReady()) return;
      const email = emailInput.value.trim();
      if (!email) {
        setMessage('請先輸入 Email，再點選忘記密碼。', 'err');
        emailInput.focus();
        return;
      }

      forgotBtn.disabled = true;
      setMessage('寄送密碼重設信中...', 'muted');
      try {
        const redirectTo = `${window.location.origin}${window.location.pathname}`;
        const { error } = await window.AdminAuth.requestPasswordReset(email, redirectTo);
        if (error) throw error;
        setMessage('已寄出重設信，請到信箱點擊連結後回到本頁設定新密碼。', 'ok');
      } catch (err) {
        setMessage(`寄送失敗：${err.message || '未知錯誤'}`, 'err');
      } finally {
        forgotBtn.disabled = false;
      }
    });

    resetPasswordBtn.addEventListener('click', async () => {
      if (!ensureConfigReady()) return;
      if (!isRecoveryMode()) {
        setMessage('請先從重設密碼信中的連結開啟此頁面。', 'err');
        return;
      }

      const nextPassword = String(newPasswordInput.value || '').trim();
      if (nextPassword.length < 6) {
        setMessage('新密碼至少 6 碼。', 'err');
        return;
      }

      resetPasswordBtn.disabled = true;
      setMessage('更新密碼中...', 'muted');
      try {
        const { error } = await window.AdminAuth.updatePassword(nextPassword);
        if (error) throw error;
        setMessage('密碼更新成功，請使用新密碼登入。', 'ok');
        newPasswordInput.value = '';
        window.history.replaceState({}, '', window.location.pathname);
        resetSection.classList.add('hidden');
      } catch (err) {
        setMessage(`更新失敗：${err.message || '未知錯誤'}`, 'err');
      } finally {
        resetPasswordBtn.disabled = false;
      }
    });

    ensureConfigReady();
    applyReasonMessage();
    initRecoveryMode();
    checkExistingSession();
  </script>
</body>
</html>
